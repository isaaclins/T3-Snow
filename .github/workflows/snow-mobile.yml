name: Mobile release

# T3-Snow mobile builds on EAS with the `snow` profile in apps/mobile/eas.json.
# Android: an installable APK, linked from the EAS build page.
# iOS: a store build, submitted to TestFlight.
#
# Needs a repository secret EXPO_TOKEN (expo.dev -> Account settings -> Access
# tokens) and the Expo owner and project id filled in the `snow` profile.

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to build
        required: true
        default: android
        type: choice
        options:
          - android
          - ios
          - all

concurrency:
  group: snow-mobile
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ inputs.platform }}
    if: github.repository != 'pingdotgg/t3code'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Require EXPO_TOKEN
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [[ -z "$EXPO_TOKEN" ]]; then
            echo "::error::Add an EXPO_TOKEN repository secret (expo.dev -> Account settings -> Access tokens)."
            exit 1
          fi

      # No sparse-checkout: eas-cli archives the project with a local
      # `git clone`, which fails on a partial clone.
      - uses: actions/checkout@v6

      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=@t3tools/mobile...

      - name: Expose pnpm
        run: |
          pnpm_version="$(node --print "require('./package.json').packageManager.split('@').pop()")"
          vp_pnpm_bin="$HOME/.vite-plus/package_manager/pnpm/$pnpm_version/pnpm/bin"
          echo "$vp_pnpm_bin" >> "$GITHUB_PATH"

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
          packager: npm

      - name: Build Android
        if: inputs.platform != 'ios'
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas build --platform android --profile snow --non-interactive --no-wait

      - name: Build iOS and submit to TestFlight
        if: inputs.platform != 'android'
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas build --platform ios --profile snow --auto-submit --non-interactive --no-wait
